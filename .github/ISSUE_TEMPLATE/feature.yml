name: Feature request
description: Propose a change to the compiler or CLI.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API, flag, or behaviour you would like.
    validations:
      required: true
